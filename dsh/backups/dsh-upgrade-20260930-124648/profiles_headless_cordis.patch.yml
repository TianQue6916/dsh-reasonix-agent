# dsh headless 锚定极简模式（2026-08-16 同步本机 Linux 配置）
# 首轮锚定：Minimal 工具对（Windows: pwsh + str_replace_editor）+ Minimal persona
# 首次持久晋升信号（tool/call 或 assistant/message）后开放全量工具目录
# 来源：xiaobright/dsh-anchored-standard（tool-bootstrap.mjs）
# 2026-09-18 dsh 0.1.5 升级适配：0.1.5 起 dsh-base 不再默认挂载
#   str_replace_editor（官方改推 read/write/edit）。锚定首轮依赖它，
#   缺失时 tool-bootstrap 会 warnOnce 并回退「全量工具目录」（锚定失效），
#   故在此显式挂载。官方文档见 @deepseek-ai/dsh-base/README.zh.md。

- id: system-prompt
  config:
# 2026-09-27: 原来的 key 是 `persona:`，但 @deepseek-ai/dsh-system-prompt 的 schema 是
#   z.object({ includeHarnessIdentity, includeRuntimeContext, personaPrefix, personaSuffix, toolOrder })
#   —— 非 strict，**未知 key 被 Zod 静默丢弃**。所以这一行以前是彻头彻尾的 no-op，
#   批处理线的 system prompt 一直是 dsh 出厂那句 "You are an AI agent powered by DeepSeek Harness."。
#   正确字段名是 personaPrefix。
    personaPrefix: |-
      You are the personal AI assistant of a Chinese undergraduate (Intelligent Science and
      Technology) who builds his own knowledge system and tooling. Treat him as a
      builder-researcher: rigorous in mathematics, hands-on in systems engineering.

      语言契约（最高优先级；覆盖任何其他风格指令或默认习惯）：
      1. 正文以中文为主，但**技术术语保留英文原文**，不做意译。
         禁止的反例：provider→"提供方"、registry→"注册表"、seam→"接缝"、candidate→"候选"、materialize→"物化"、verbatim→"逐字"、declaration row→"声明行"。
         正例：skill / patch / bundle / provider / session / scope / rank / hook / token / cache / rollout / sandbox 一律保留原词。
      2. 术语首次出现时可用括号加中文短注，之后只用英文原词。
      3. 代码、路径、命令、字段名、包名、API 名原样保留，不翻译、不改格式。
      4. 数学与技术名词用通行英文（theorem / proof / eigenvalue / injection），解释用中文。
      5. **思考链（reasoning / thinking）同样遵守本契约：用中文思考**，英文术语原样保留，不要在 thinking 里输出完整英文句子。
      6. 这个用户是宁夏大学智能科学与技术专业的学生（大一暑假 → 大二上），构建主义研究式学习者。
         涉及教学 / 翻译 / 方案设计 / 代码等实质任务前，先调 `memory_profile` 校准讲法与深度：
         走「本质 → 公式 → 跨学科连接」；不甩他未学过的概念（群论 / 环论 / 拓扑 / 非标准分析）；
         不掩盖核心思想，不只给公式，不空洞赞美。
    # 关掉出厂开场白，让语言契约成为系统提示词的第一段
    # （与 web 侧 preset-anchored-standard 的 `complete: true` 语义对齐）
    includeHarnessIdentity: false

- insert:
    - id: tool-bootstrap
      name: ../../.agent-presets/anchored-standard/tool-bootstrap.mjs
      config:
        bootstrapTools: [ pwsh, str_replace_editor, mcp__goatquota__goat_quota ]
        promoteOn: either
        compactionTools: [ read, write, edit, glob, grep, todo_write, ask_user_question ]

    # 0.1.5 起必须显式挂载（见文件头说明）
    - id: tool-str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    - id: mcp-goatquota
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: goatquota
        transport: stdio
        command: node
        args: [ 'D:/Toolbox/goat-gateway/mcp-goat-quota.mjs' ]

    # ── 按需发现 + preset 本地工具（2026-09-27 与 web 侧同步）──────────────────
    # 之前这条线没有这三个插件，而晋升后的 keep-set 是
    #   bootstrapTools + RESIDENT_DISCOVERY_TOOLS + unlocked
    # 其中 RESIDENT_DISCOVERY_TOOLS 的三个名字在 catalog 里不存在
    # → 被过滤器丢掉 → 工具面恒为 bootstrap 那 3 个。
    # 结果：任务里写「用 Read/Write 工具」，但那条线上根本没有 read/write，
    # agent 只能用 pwsh 兜底（实测某 session pwsh 调用 19 次）。
    - id: dev-tool-search
      name: ../../.agent-presets/anchored-standard/dev-tool-search.mjs

    - id: skill-search
      name: ../../.agent-presets/anchored-standard/skill-search.mjs

    # 共享 reasonix 记忆语料（~/.reasonix/memory）；让 use-user-persona-before-tasks
    # 那条「实质任务前先调 memory_profile」在批处理线上也能触发。
    - id: memory-reasonix
      name: ../../.agent-presets/anchored-standard/memory.mjs

    # ── local git context（2026-09-28）────────────────────────────────────────
    # headless 这条线**没有挂 context-gate**，所以注入在第一轮就可见 ——
    # 这也让它成为验证 git-context.mjs 是否真的生效的最短路径。
    - id: git-context
      name: ../../.agent-presets/anchored-standard/git-context.mjs
      config:
        enabled: true
        maxCommits: 3
        repos:
          - 'C:/Users/27063/.dsh'
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: commandcode-goat
    model: deepseek/deepseek-v4.1-flash
    reasoningEffort: high
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
