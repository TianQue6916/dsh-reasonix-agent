- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
    maxParallelToolCalls: 100
- id: pwsh-sandbox
  name: "@deepseek-ai/dsh-pwsh-sandbox"
  config:
    maxOutputBytes: 640000
    pwshPath: 'C:\Program Files\PowerShell\7\pwsh.exe'
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose

- id: mnemon
  name: dsh-mnemon
  config:
    remoteAccess: trusted-host
    timeoutMs: 10000
    defaultRecallLimit: 10
    embedding:
      enabled: true
      endpoint: http://localhost:11434
      model: nomic-embed-text
    memoryView:
      strategyTypeId: default-three-tier
      entries:
        include:mnemon-strategy-auto-capture:
          enabled: true
          config: {}
        include:mnemon-strategy-scoped:
          enabled: true
          config: {}
        include:mnemon-strategy-light-context:
          enabled: true
          config: {}
    recallQuality:
      policy: strict-v1
      lowScoreThreshold: 0.25
      highScoreThreshold: 0.6
      candidateMultiplier: 3
      maxMediumResults: 4
      maxUnknownResults: 2
    routingGuidance: true
    tabEnabled: true
    writeEnabled: true
    lifecycleEnabled: true
    recallMode: guided
    writebackMode: guided
    # 2026-10-26：30 s → 300 s。idle checkpoint review 是「直接写 mnemon」的通路，而 insight 是 append-only
    # （更新 = 新记录 + 旧记录软删）⇒ 每次 idle 写一条，同标题碎片累积（实测 441 条里 158 条是碎片）。
    # 降频后配合 backup-to-github.ps1 §5.5 的每夜自动收口；根因详见 kb/06-memory-architecture.md。
    idleReviewMs: 300000
    idleReview:
      maxTokens: 32768
    syncEnabled: true

# ── 微信 bot 桥接（2026-09-30 从 reasonix 侧迁入）────────────────────────────
# 迁移第 1 步已完成（不影响 reasonix 侧，微信全程照常服务）：
#   * 包：@lanbaolu/dsh-wechat-bridge@0.9.1 已装进 profiles/web
#   * 凭据：reasonix 的 iLink 凭据已无损转换成插件 schema
#       ~/.dsh/wechat-bridge/accounts/cf29d3b9eb6f@im.bot.json
#       ~/.dsh/wechat-bridge/context-tokens.json
#     转换脚本 storages/tools/migrate-reasonix-wechat-credentials.mjs
#     （reasonix 侧 {token, base_url, user_id} + 文件名当 accountId
#       → 插件侧 {accountId, botToken, baseUrl, userId}；两侧同一个官方 iLink 端点
#         https://ilinkai.weixin.qq.com，所以不需要重新扫码）
#
# ⚠ 本 row 存在的唯一理由是**覆盖插件自带 patch 的 autoStart: true**。
#   同一台机器上两套 gateway 同时在线会双响应（同一条微信回两次）；
#   reasonix 的 leader election 每分钟 ping 的是另一台机器，管不了同机第二个 harness。
#   所以迁移动刀的那一刻必须：先 weixin-bot-switch.ps1 -Mode ToDsh 停 reasonix 侧，
#   确认停干净，再把这里的 autoStart 改成 true（或从 Web 面板手动启动 daemon）。
#   row 是 replace 语义，所以下面要把插件自带 patch 的其余字段原样带上，否则会丢。
- id: dsh-wechat-bridge
  name: "@lanbaolu/dsh-wechat-bridge"
  config:
    dataDir: ''
    host: 127.0.0.1
    port: 0
    autoStart: true
    provider: ''
    model: ''
    workingDirectory: ''
- id: mnemon-strategy-auto-capture
  disabled: false

# ══ 以下两段从原 desktop profile 原样保留 / 合并（2026-09-30 全量移植）══════════════════
# ui-settings-account 的 step/completion 是桌面端「首次引导已完成、走 API Key」的状态位；
# 被 web 的 patch 覆盖掉会重新触发一遍引导流程。
# ui-chat 取 web 的 transcriptView（verbose，用户自己的习惯）+ 桌面端默认的
# performanceUsage: detailed。
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
    performanceUsage: detailed
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
    fontSize: 13
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: true
    titleBarScheme: preset
    titleBarPresetId: dsh-desktop
    titleBarCompat: true
# reload-touch: 2026-10-04T10:31:28
# ── session-title-llm：上游把 maxOutputTokens 定成 64，对开 thinking 的 route 太小 ──
# title 请求继承主 session 的 route（实测 875/888 条是 commandcode-goat /
# deepseek/deepseek-v4.1-flash，默认 thinking enabled）⇒ reasoning 会吃光 64 token
# 预算 ⇒ 上游回 finish_reason="length" ⇒ 标题拿不到可见文本
# （`session-title-llm: title output reached maxOutputTokens`），
# 并在 UI 弹「已达到输出 token 上限」通知。
# 取证：1070 个 session_projcache/sessions 中 888 条 title-llm-request 全是 maxTokens=64；
# gateway logs 里 finish=length 只有 4 条，且 completion_tokens == reasoning_tokens == 64。
# 正常标题只要 ~10 token，512 只在 thinking 失控时才用得上 ⇒ 提到 512。
- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 512
    timeoutMs: 60000

# === thinking-guard 调参（2026-10-04） ===
# web 侧这份 row 早就存在（profiles/web/cordis.patch.yml:1271），desktop 侧一直没有 ⇒
# desktop 走 node_modules 里 bundle 自带的 cordis.patch.yml。两处都是覆盖源，值必须一致，
# 否则会出现「同一台机器两个 profile 行为不同」且极难排查。这里把 desktop 也收敛到 profile row。
#
# 参数理由（源码：node_modules/@ethanwong-hk/dsh-thinking-guard/lib/index.js）：
#   `if (noProgress && st.reasoningChars > 0) { const heldMs = Date.now() - st.lastProgressAt;
#    if (heldMs >= cfg.thinkingOnlyMs) trip(agent, st, 'thinking-only-timeout', { heldMs }); }`
#   ⇒ 触发要求 reasoning 已开始流出但持续 N ms 无 text / tool-call。原 thinkingOnlyMs=45000
#   在本机主力 model（maxTokens 262144）上会把「深度思考 45 秒」误判为空转；trip 后
#   `autoContinue` 会 agent.followup() 注入「继续」并开新 attempt ⇒ 重新计时 ⇒ 再熔断，
#   形成「熔断→继续→空转→再熔断」的消耗循环，用户看到的就是 turn 被莫名中止。
#   实测取证：4 个 session 留下真实 trip 痕迹（session 里含 `思考空转被熔断中止` 与
#   `source.plugin='thinking-guard'` 的 user/message），最近一次在 2026-10-04 00:14。
# 另：`maxThinkingChars` 80000（≈20k token）对 262144 预算偏紧 ⇒ 200000（≈50k token）。
# `verbose: true` 才能让 lib/index.js:299 的 log() 落盘（`:499` 的「已启用：…」一行），
# 这是唯一可验证「参数真的生效」的痕迹通道（见 $DSH_HOME/logs/host-stdio.log 的 [out] 前缀）。
- id: thinking-guard
  config:
    # 2026-10-28 重调：作者源码注释里的实测数据（C:/tmp/fx/，40 条真实退化 + 163 条正常 reasoning）
    #   novelty（窗口 4096、阈值 0.20）：检出 40/40、误报 0.6%、中位命中 6144 字符
    #   sparse-repeat              ：检出 40/40、误报 9.2%、中位命中 3072 字符
    #   ⇒ novelty 误报低一个数量级，代价是命中晚一倍。保留 novelty，关掉 sparse-repeat。
    enabled: false
    thinkingOnlyMs: 300000
    maxThinkingChars: 200000
    repeatThreshold: 3
    # 关掉稀疏复读一档（误报 9.2%，命中样本全是列表编号 / 版本号 / 表格分隔线）
    sparseWindow: 4000
    sparseMinCount: 999999
    # novelty 保持作者实测最优值
    noveltyWindow: 4096
    noveltyThreshold: 0.2
    gramDensity: 2.7
    # 不自动继续：autoContinue 会 followup 一条「继续」并开新 attempt ⇒ 重新计时 ⇒ 再熔断
    autoContinue: false
    notify: true
    verbose: true

# ── token-meter usage-first 补丁（2026-10-04 加入）───────────────────────
# 为什么：auto-compaction 的触发判据是 ctx.tokenMeter.measure().totalTokens，
# 而上游只在 usageTokens(usage) >= estimatedAnchorTokens 时才采信 provider usage
# （把 char/4 估算当下界）。per-step snapshot 注入把估算撑到真实值的 ~3.4 倍，
# 所以长会话里 usage 永远不合格 ⇒ 账本虚高 ⇒ compaction 在真实占用 10-16% 就触发，
# 把还没接近上限的对话压掉——用户看到的「上下文突然消失」。
# 为什么用 plugin：web/headless 的 dsh-token-meter 来自 ~/.dsh/profiles/node_modules，
# 而 desktop（Electron App）从 resources/app.asar 解析 core——同一份文件补丁只能修一侧。
# 这个 plugin 直接包住 ctx.tokenMeter 服务实例，两侧都管用；已打补丁的副本走 fast path（无副作用）。
# 回滚：python ~/.dsh/storages/tools/patch-tm-usage-first.py --restore
- insert:
    - id: tm-usage-first
      name: ../../plugins/tm-usage-first.mjs

# ── /compact 命令在 UI 里消失的修复（2026-10-22） ────────────────────────────
# 现象：输入框 `/` 菜单里没有 compact 项，`/compact` 被打成普通文本发出去，
#       session 账本里 command/run 事件停在 2026-10-17 22:22:55 再无新增。
# 根因：@deepseek-ai/dsh-web-app 的 bundle patch 在**顶层**把 command-compact
#       设为 disabled: true（`--dump-config` 可见 `- id: command-compact` /
#       `disabled: true`，紧跟 compaction-basic 同样 disabled）。preset group 内
#       那一份是启用的，但 UI 的 `/` 菜单读的是顶层命令注册表，所以菜单里没有。
# 修法：在 profile 顶层用同名 row 覆盖回 enabled。patch 顺序 = 后写覆盖先写，
#       所以这条必须留在文件末尾附近，不要挪到 bundle 声明之前。
- id: command-compact
  disabled: false

# ── 让 `/compact` 真正注册上（2026-10-22 21:0x） ─────────────────────────────
# 上一层只把 command-compact 的 disabled 改回 false，菜单里仍然没有 compact。
# 原因：command-compact 的 inject = ["commands", "compaction"]，而 `compaction`
#       服务由 @deepseek-ai/dsh-compaction 的 CompactionEngine 提供
#       （`var CompactionEngine = class extends Service { super(ctx, "compaction") }`），
#       它由 compaction-basic 实例化。顶层 compaction-basic 被 dsh-web-app 设为
#       disabled: true ⇒ 服务不存在 ⇒ command-compact 停在 pending ⇒ 命令不注册
#       ⇒ UI 的 `/` 菜单里当然没有。
# 修法：顶层把 compaction-basic 也启用，但 auto: false 保证只提供手动 /compact，
#       不做任何自动压缩（自动压缩早已由 bili 的 wire 层承担）。
- id: compaction-basic
  disabled: false
  config:
    auto: false
    maxTokens: 32768
- id: dsh-context
  name: dsh-context
  config:
    overviewAutoSteps: "300"
    defaultOverviewRange: 7d

# 2026-10-24：desktop profile 需要写 D:\Desktop（学习文档双端落盘；桌面是 junction → D:\Desktop）。
# 此前 shell 跑在 Low IL 受限令牌（WRITE_RESTRICTED），D 盘全程 EPERM。
# 回滚：删掉本段并重启 dsh 进程。
# 注意（2026-10-24 实测）：patchReload HMR 不重建已构造的 sandbox-policy service，
# 改完当前进程的 shell 仍是 Low IL，必须重启 Reasonix.exe 才生效。
- id: sandbox-policy
  config:
    mode: danger-full-access

# 2026-10-25 覆盖插件配置。注意：patch 对 config 是「整体替换」不是深合并，
# 所以必须把全部开关写全，否则会回落到 DEFAULT_CONFIG（那里 enableDeepseek 默认 true）。
- id: local-wiki-github
  config:
    enableGithub: true
    enableDeepseekSearch: true
    enableBing: true
    enableWiki: true
    enableGoat: false
    enableDeepseek: false
    maxResults: 74
    deepseekSearchCount: 50
    tagTitles: true
- id: mnemon-strategy-light-context
  disabled: false
- id: mnemon-strategy-general
  disabled: false
# === 子 agent 并发上限：8 → 32（2026-10-28） ===
# 源码 @deepseek-ai/dsh-subagent static Config:
#   maxActiveSubagents: z.number().step(1).min(1).max(Number.MAX_SAFE_INTEGER).default(8).volatile()
# 报错原文：subagent limit reached (active child limit: 8)
# 与 agent-loop 的 maxParallelToolCalls(100) 是两道独立闸门：前者管 tool 调度，后者管子代理存活数。
# volatile ⇒ 每次新建/冷恢复前现读，改完即时生效，不必重启。
- id: subagent
  config:
    maxActiveSubagents: 32

# === 会话标题：切到官方 experimental all-prompts provider（2026-10-28） ===
# 与 profiles/web/cordis.patch.yml 同段一致，但本 profile 的安装方式不同：
#   `dsh plugin --profile desktop add` 会被 App 拒绝
#   （error: profile "desktop" is managed exclusively by the Electron application），
#   所以 bundle 必须在 App 的插件市场里装，装完重启 App 才加载。
# bundle @deepseek-ai/dsh-experimental-session-titles-bundle@0.2.1-rc.2 自带 patch 会：
#   ① 把 session-title-llm（first-prompt）置 disabled: true；
#   ② 插入 id: optional-session-title-all-prompts 一行，默认 maxOutputTokens: 64 / maxInputBytes: 4096。
# 两者都会静默失败：64 token 被 thinking 吃光（本机 2026-09 实测 643 条 session 全栽在这）；
# maxInputBytes 超限是 throw 不是截断（@deepseek-ai/dsh-session-title-llm/lib/index.js:170），
# 而本机 958 个顶层 session 聚合 human message 字节数中位 14533 B、75.3% 超 4096。
# 故在此覆盖成 262144（覆盖 97.4%；剩 25 条 >256KB 的超长会话物理上刷不了）。
# 本行在 bundle 未安装时只会打印 `patch: entry "..." not found` 的 warn（实测 exit=0，不阻塞启动）。
# 回滚：注释掉下面 config 四行。
# [停用 2026-10-29 · 改用 @weibaohui/dsh-smart-title] - id: optional-session-title-all-prompts  # [已停用 2026-10-29 · 改用 @weibaohui/dsh-smart-title]
#   config:
#     targetWords: 5
#     targetCjkCharacters: 10
#     maxInputBytes: 262144
#     maxOutputTokens: 4096
#     timeoutMs: 60000
- id: ds-harness-remote
  name: ds-harness-remote
  config:
    enabled: true
    role: host
    serverUrl: https://dsh.r2049.cn
    codex:
      enabled: true
      binary: codex
    terminal:
      enabled: true
    remoteTools:
      enabled: false
    hostControl:
      enabled: true
    loopback:
      ports: []
    forceRelay: false
    logLevel: info
    reconnect:
      initialDelayMs: 1000
      maxDelayMs: 30000
      jitter: 0.2
    cursor:
      enabled: false
      binary: agent
    acp:
      enabled: true
      backends:
        - id: codex
          enabled: true
          command: codex
          args:
            - app-server
        - id: cursor
          enabled: false
          command: agent
          args:
            - acp
        - id: antigravity
          enabled: true
          command: agy
          args:
            - --input-format
            - stream-json
            - --output-format
            - stream-json
        - id: pi
          enabled: true
          command: pi-acp
          args: []
        - id: claude
          enabled: true
          command: claude-agent-acp
          args: []
        - id: opencode
          enabled: true
          command: opencode
          args:
            - acp

# ── journal-hook ─────────────────────────────────────────────────────────────
# dsh 启动时把日记 sampler 拉起来。原因：sampler 是常驻进程，本机 shell 在 Low IL
# 下无法写 Startup / schtasks，重启即消失（2026-10-29/30 因此断档两天）。
# 放在 host-plane（顶层 insert），只 import node:* 内建，全程 try/catch 静默失败。
# 幂等：sampler 自带命名 mutex；另有 throttleMs 兜住 patchReload 反复触发。
- insert:
    - id: journal-hook
      name: ../../.agent-presets/anchored-standard/journal-hook.mjs
      config:
        enabled: true
        throttleMs: 3600000
