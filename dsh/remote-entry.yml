- id: ds-harness-remote
  name: ds-harness-remote
  config:
    enabled: true
    role: host
    serverUrl: https://dsh.r2049.cn
    codex:
      enabled: true
      binary: codex
    terminal:
      enabled: true
    remoteTools:
      enabled: false
    hostControl:
      enabled: true
    loopback:
      ports: []
    forceRelay: false
    logLevel: info
    reconnect:
      initialDelayMs: 1000
      maxDelayMs: 30000
      jitter: 0.2
    cursor:
      enabled: false
      binary: agent
    acp:
      enabled: true
      backends:
        - id: codex
          enabled: true
          command: codex
          args:
            - app-server
        - id: cursor
          enabled: false
          command: agent
          args:
            - acp
        - id: antigravity
          enabled: true
          command: agy
          args:
            - --input-format
            - stream-json
            - --output-format
            - stream-json
        - id: pi
          enabled: true
          command: pi-acp
          args: []
        - id: claude
          enabled: true
          command: claude-agent-acp
          args: []
        - id: opencode
          enabled: true
          command: opencode
          args:
            - acp

# ── journal-hook ─────────────────────────────────────────────────────────────
# dsh 启动时把日记 sampler 拉起来。原因：sampler 是常驻进程，本机 shell 在 Low IL
# 下无法写 Startup / schtasks，重启即消失（2026-10-29/30 因此断档两天）。
# 放在 host-plane（顶层 insert），只 import node:* 内建，全程 try/catch 静默失败。
# 幂等：sampler 自带命名 mutex；另有 throttleMs 兜住 patchReload 反复触发。
- insert:
    - id: journal-hook
      name: ../../.agent-presets/anchored-standard/journal-hook.mjs
      config:
        enabled: true
        throttleMs: 3600000