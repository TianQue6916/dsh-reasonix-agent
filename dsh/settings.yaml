# dsh 全局设置 — 天阙 Linux（本机）
# 默认模型走 Command Code GOAT 套餐（2026-09-03 用户拍板：以后不论什么模型都默认 commandcode）
agent-default-model:
  provider: commandcode-goat
  model: deepseek/deepseek-v4.1-flash
  reasoningEffort: high
# llm-fallbacks（2026-08-16 补配，web profile 用）：pro 失败降级 flash 续跑
fallbacks:
  enabled: true
  rootChain:
    - deepseek/deepseek-v4.1-flash
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

# ── Command Code GOAT 路由（2026-09-03 加入；dsh-llm-pi-ai dormant 挂载，此分节即时注册）──
llm-pi-ai:
  providers:
    commandcode-goat:
      displayName: Command Code GOAT
      apiKeyEnv: COMMANDCODE_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:8788/v1
      # GOAT deepseek 系返回 reasoning，与 deepseek 兼容
      compat:
        thinkingFormat: deepseek
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      # 输出上限（2026-09-20 用户要求「不要有输出上限」）：
      # adapter 内置 DEFAULT_MAX_TOKENS = 32768，模型条目不写 maxTokens 时全部走它。
      # 这里抬到 65536 作全局兜底（GLM/Gemini 等窄上限模型也能接受），
      # 再对实测支持更大的模型逐条设 maxTokens: 262144（见各 deepseek/Kimi/GPT 条目）。
      defaultMaxTokens: 65536
      # 中断抗性（2026-09-20）：长输出时流式连接会中途断（事件 llm/retry,
      # code=TRANSPORT, "Stream ended without finish_reason"）。
      # 重试策略归 provider 所有，由 @deepseek-ai/dsh-llm-retry 执行。
      # 默认 normal/maxRetries=2/退避 500ms→10s；这里提高重试次数与退避上限。
      # 注意：旧式扁平字段 maxRetries / maxRetryDelayMs 已被 pi-ai 拒绝（会抛错），
      # 必须写在 retryPolicy: 之下。
      # 另一档是 mode: always（无上限重试直到成功/取消）——抗中断最强，
      # 但**确定性错误（如 400 参数错）也会无限重试并持续计费**，故默认不用。
      retryPolicy:
        mode: normal
        maxRetries: 8
        backoff:
          initialDelayMs: 1000
          maxDelayMs: 30000
          jitterRatio: 0.2
      models:
